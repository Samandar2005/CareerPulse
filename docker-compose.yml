version: '3.8'

services:
  # 1. PostgreSQL + PGVector Servisi
  db:
    image: pgvector/pgvector:pg15
    container_name: career_plus_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: career_db
    ports:
      - "5430:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Kesh va Celery Broker Servisi
  redis:
    image: redis:7-alpine
    container_name: career_plus_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 3. FastAPI Web API Servisi
  web:
    build: .
    container_name: career_plus_web
    restart: always
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Celery Asinkron Worker Servisi
  celery_worker:
    build: .
    container_name: career_plus_celery_worker
    restart: always
    command: celery -A src.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data: