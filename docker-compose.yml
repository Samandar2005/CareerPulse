version: '3.8'

services:
  # 1. PostgreSQL + PGVector Servisi
  db:
    image: pgvector/pgvector:pg15
    container_name: career_plus_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: career_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d career_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Kesh va Celery Broker Servisi
  redis:
    image: redis:7-alpine
    container_name: career_plus_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # 3. MinIO S3 Object Storage Servisi
  minio:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: career_plus_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"  # API Port
      - "9001:9001"  # Web Console Port
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. FastAPI Web API Servisi
  web:
    build: .
    container_name: career_plus_web
    restart: always
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # 5. Celery Asinkron Worker Servisi (Ingestion va Fon topshiriqlari uchun)
  celery_worker:
    build: .
    container_name: career_plus_celery_worker
    restart: always
    command: celery -A src.worker.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data: